# Render Blueprint — deploys the DevBoard GraphQL API.
# In Render: New + > Blueprint, point it at this repo, then set MONGODB_URI.
services:
  - type: web
    name: devboard-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
